services:
  - type: web
    name: parlay-api
    runtime: python
    plan: free
    # Must match the Neon project's region (us-east-2). Render defaults to Oregon, which
    # would put every query on a cross-country round trip. A blueprint service cannot
    # change region after creation -- only be destroyed and recreated.
    region: ohio
    rootDir: backend
    buildCommand: pip install -e . && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # Neon connection string, rewritten to the asyncpg driver:
      #   postgresql+asyncpg://user:pass@host/db?ssl=require
      # Replace ?sslmode=require with ?ssl=require -- asyncpg rejects `sslmode` as an
      # unknown kwarg, but with no ssl argument at all it falls back to plaintext and
      # Neon refuses the connection. Drop channel_binding. Use the direct host, not
      # the -pooler one: the app runs its own pool (see app/db.py).
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INTERNAL_TICK_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Both of these are the frontend's URL, e.g. https://app.yourdomain.com.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Lax is correct only while the web app and this API are subdomains of the SAME
      # registrable domain (app.example.com + api.example.com) -- the cookie is then
      # first-party, which is what keeps Safari from dropping it.
      #
      # If you ever move them back to different domains (*.vercel.app + *.onrender.com),
      # this MUST become `none` or no browser will send the cookie at all. Do not test
      # sign-in until the custom domains actually resolve.
      - key: COOKIE_SAMESITE
        value: lax
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
