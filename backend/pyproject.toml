[project]
name = "parlay-backend"
version = "0.1.0"
description = "Fantasy weekly parlay - backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "google-auth>=2.37",
    # google.auth.transport.requests needs this; google-auth does not pull it in itself.
    "requests>=2.32",
    "pyjwt>=2.10",
    "python-dateutil>=2.9",
    # Ships the IANA timezone database. Without it ZoneInfo("America/New_York") raises on
    # Windows and on slim Linux images, and every deadline silently renders in UTC.
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
